name: Required Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typesetting-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@5e1ba6e10229bd876c6594189bdab1a62b9d0b1c # v4.0.6
        with:
          tectonic-version: "0.17.0"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run required gate
        run: make required-gate
