name: Build Manuscript PDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  manuscript-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@v3
      - name: Build PDF
        run: make manuscript-pdf
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: .tmp/manuscript-build/paper.pdf

