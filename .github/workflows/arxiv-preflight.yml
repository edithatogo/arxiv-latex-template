name: arXiv Preflight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typesetting-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arxiv-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@5e1ba6e10229bd876c6594189bdab1a62b9d0b1c # v4.0.6
        with:
          tectonic-version: "0.17.0"
      - name: Run arXiv preflight
        run: make arxiv-upload-ready
      - name: Upload arXiv bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arxiv-upload-ready
          path: dist/arxiv/
          retention-days: 90
      - name: Attest checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/arxiv/SHA256SUMS
