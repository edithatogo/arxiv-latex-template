name: arXiv Preflight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typesetting-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arxiv-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@eb29fd68b7d3f76011906b6e45ea4320c8de5d2f # v4.0.5
        with:
          tectonic-version: "0.17.0"
      - name: Run arXiv preflight
        run: make arxiv-upload-ready
      - name: Upload arXiv bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arxiv-upload-ready
          path: dist/arxiv/
          retention-days: 90
      - name: Attest checksums
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/arxiv/SHA256SUMS
